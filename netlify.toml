[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"  # <- un seul bloc [functions], pas d'autre plus bas

# Upload d'images
[[redirects]]
  from = "/api/upload-image"
  to = "/.netlify/functions/upload-image"
  status = 200

# Admin API
[[redirects]]
  from = "/api/admin/list-products"
  to = "/.netlify/functions/admin-list-products"
  status = 200

[[redirects]]
  from = "/api/admin/save-products"
  to = "/.netlify/functions/admin-save-products"
  status = 200

[[redirects]]
  from = "/api/admin/delete-product"
  to = "/.netlify/functions/admin-delete-product"
  status = 200

# Catch-all vers les Functions (utile si tu en ajoutes d'autres plus tard)
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200
