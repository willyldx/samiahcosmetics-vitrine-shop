[build]
  # Dossier publié (mets "." si ton index.html est à la racine ;
  # sinon, remplace par "dist", "build", etc.)
  publish = "."

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# --- API -> Functions (toujours AVANT le fallback SPA) ---
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Accès direct aux functions (utile pour tester /_.netlify/functions/*)
[[redirects]]
  from = "/.netlify/functions/*"
  to   = "/.netlify/functions/:splat"
  status = 200
  force = true

# --- Fallback SPA (TOUJOURS EN DERNIER) ---
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
