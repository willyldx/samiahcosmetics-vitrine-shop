<svg xmlns="http://www.w3.org/2000/svg"
     width="3000" height="3000"
     viewBox="0 0 3000 3000"
     aria-label="Samiah Cosmetics - Tools Logo">

  <!-- Groupe central -->
  <g transform="translate(1500,1500)">

    <!-- Cercles -->
    <circle cx="0" cy="0" r="650" fill="none" stroke="#C7A27A" stroke-width="22"/>
    <circle cx="0" cy="0" r="520" fill="none" stroke="#111" stroke-width="12"/>

    <!-- OUTILS COSMÉTIQUES EN ICÔNES LIGNES -->
    <g stroke="#111" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">

      <!-- Pinceau haut -->
      <g transform="rotate(0)">
        <path d="M0 -900 v200" />
        <path d="M-40 -700 h80" />
      </g>

      <!-- Rouge à lèvres -->
      <g transform="rotate(45)">
        <rect x="-40" y="-840" width="80" height="160" rx="20"/>
        <path d="M0 -840 v-120" />
      </g>

      <!-- Flacon sérum -->
      <g transform="rotate(90)">
        <rect x="-60" y="-850" width="120" height="220" rx="30"/>
        <path d="M-20 -850 v-100 h40 v100" />
      </g>

      <!-- Peigne -->
      <g transform="rotate(135)">
        <rect x="-120" y="-820" width="240" height="70" rx="20"/>
        <line x1="-100" y1="-820" x2="-100" y2="-750"/>
        <line x1="-60" y1="-820" x2="-60" y2="-750"/>
        <line x1="-20" y1="-820" x2="-20" y2="-750"/>
        <line x1="20" y1="-820" x2="20" y2="-750"/>
        <line x1="60" y1="-820" x2="60" y2="-750"/>
        <line x1="100" y1="-820" x2="100" y2="-750"/>
      </g>

      <!-- Mascara -->
      <g transform="rotate(180)">
        <rect x="-30" y="-810" width="60" height="240" rx="20"/>
        <line x1="0" y1="-810" x2="0" y2="-950"/>
      </g>

      <!-- Petit miroir -->
      <g transform="rotate(225)">
        <circle cx="0" cy="-820" r="110"/>
        <line x1="0" y1="-710" x2="0" y2="-630"/>
      </g>

      <!-- Mini palette -->
      <g transform="rotate(270)">
        <rect x="-150" y="-870" width="300" height="160" rx="30"/>
        <circle cx="-80" cy="-790" r="35"/>
        <circle cx="0"   cy="-790" r="35"/>
        <circle cx="80"  cy="-790" r="35"/>
      </g>

      <!-- Crayon lèvres -->
      <g transform="rotate(315)">
        <path d="M-20 -950 L20 -950 L20 -750 L-20 -750 Z"/>
        <path d="M-20 -950 L0 -990 L20 -950" />
      </g>

    </g>

    <!-- TEXTE -->
    <g fill="#111" font-family="Garamond, Georgia, 'Times New Roman', serif">
      <text x="0" y="-40"
            font-size="360"
            font-weight="600"
            letter-spacing="40"
            text-anchor="middle">
        SAMIAH
      </text>

      <text x="0" y="190"
            font-size="110"
            letter-spacing="35"
            text-anchor="middle"
            style="text-transform:lowercase;">
        cosmetics
      </text>
    </g>

    <!-- courbe décorative -->
    <g fill="none" stroke="#111" stroke-width="12">
      <path d="M -680,100  C -350,360 350,360 680,100" />
      <path d="M -60,120 C -20,260 20,260 60,120 C 30,200 -30,200 -60,120 Z" />
    </g>

  </g>
</svg>
