<!-- assets/images/samiah-C-tools-premium.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="3000" height="3000"
     viewBox="0 0 3000 3000"
     aria-label="Samiah Cosmetics - Premium Tools Logo">

  <defs>
    <!-- Couleurs principales -->
    <style>
      .gold { stroke:#C7A27A; fill:none; }
      .gold-fill { fill:#C7A27A; }
      .ink { stroke:#F5F5F5; fill:none; }
      .ink-fill { fill:#F5F5F5; }
      .round { stroke-linecap:round; stroke-linejoin:round; }
    </style>

    <!-- Ombre douce pour le cercle et le texte -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="28"
                    flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fond noir luxe -->
  <rect x="0" y="0" width="3000" height="3000" fill="#000000"/>

  <!-- GROUPE GLOBAL -->
  <g transform="translate(1500,1500)" filter="url(#softShadow)">

    <!-- CERCLES PRINCIPAUX -->
    <circle cx="0" cy="0" r="700"
            class="gold round" stroke-width="26"/>
    <circle cx="0" cy="0" r="560"
            class="ink round" stroke-width="10" opacity="0.9"/>

    <!-- OUTILS COSMÉTIQUES PREMIUM (4 icônes) -->
    <g stroke-width="20" class="round">

      <!-- Pinceau maquillage (haut) -->
      <g transform="translate(0,-800)">
        <!-- manche -->
        <line x1="0" y1="60" x2="0" y2="260" class="ink"/>
        <!-- ferrule dorée -->
        <rect x="-32" y="10" width="64" height="70"
              class="gold" stroke-width="12"/>
        <!-- poils -->
        <path d="M-80,10 C-40,-70 40,-70 80,10"
              class="ink"/>
      </g>

      <!-- Rouge à lèvres (droite) -->
      <g transform="translate(800,0)">
        <!-- corps -->
        <rect x="-60" y="-80" width="120" height="260" rx="28"
              class="ink"/>
        <!-- base dorée -->
        <rect x="-60" y="120" width="120" height="90" rx="24"
              class="gold" stroke-width="14"/>
        <!-- raisin -->
        <path d="M-36,-80 L0,-150 L36,-80 Z"
              class="ink"/>
      </g>

      <!-- Flacon de sérum (bas) -->
      <g transform="translate(0,800)">
        <!-- bouteille -->
        <rect x="-90" y="-260" width="180" height="260" rx="50"
              class="ink"/>
        <!-- col -->
        <rect x="-52" y="-330" width="104" height="70" rx="20"
              class="gold" stroke-width="14"/>
        <!-- pipette -->
        <line x1="0" y1="-330" x2="0" y2="-420"
              class="ink"/>
        <circle cx="0" cy="-430" r="22"
                class="ink"/>
      </g>

      <!-- Miroir de poche (gauche) -->
      <g transform="translate(-800,0)">
        <!-- cadre -->
        <circle cx="0" cy="-40" r="130" class="ink"/>
        <!-- éclat doré -->
        <path d="M-40,-120 L-10,-150 M10,-90 L40,-120"
              class="gold" stroke-width="10"/>
        <!-- manche -->
        <line x1="0" y1="90" x2="0" y2="210" class="ink"/>
      </g>
    </g>

    <!-- TEXTE / WORDMARK -->
    <g font-family="Garamond, Georgia, 'Times New Roman', serif"
       text-anchor="middle">

      <!-- SAMIAH -->
      <text x="0" y="40"
            font-size="360"
            font-weight="600"
            letter-spacing="40"
            class="ink-fill">
        SAMIAH
      </text>

      <!-- cosmetics -->
      <text x="0" y="230"
            font-size="120"
            letter-spacing="40"
            class="gold-fill"
            style="text-transform:lowercase;">
        cosmetics
      </text>
    </g>

    <!-- LIGNE & BOUCLE DÉCORATIVES (rappel du logo original) -->
    <g class="ink round" stroke-width="12" fill="none">
      <!-- grande ligne sous le texte -->
      <path d="M -720,140 C -360,360 360,360 720,140" />
      <!-- boucle centrale -->
      <path d="M -70,150
               C -20,310  20,310  70,150
               C 40,240  -40,240  -70,150 Z" />
    </g>

  </g>
</svg>
